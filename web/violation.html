<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Violations | Smart Traffic</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root { --primary: #1976d2; --dark: #2c3e50; --light: #f4f6f8; --danger: #e74c3c; }
    body { margin: 0; font-family: 'Roboto', sans-serif; background: var(--light); overflow-x: hidden; }

    /* MENU & SIDEBAR (Dùng chung style) */
    .sidebar { height: 100vh; width: 250px; position: fixed; top: 0; left: 0; background: var(--dark); color: white; transition: 0.3s; z-index: 100; padding-top: 60px; }
    .sidebar.collapsed { left: -250px; }
    .sidebar a { display: block; padding: 15px 25px; color: #ecf0f1; text-decoration: none; transition: 0.2s; }
    .sidebar a:hover, .sidebar a.active { background: #34495e; border-left: 4px solid var(--primary); }
    
    .content { margin-left: 250px; padding: 20px; transition: 0.3s; }
    .content.expanded { margin-left: 0; }
    .menu-btn { font-size: 24px; cursor: pointer; border: none; background: none; }
    .top-bar { display: flex; align-items: center; margin-bottom: 20px; }

    /* LAYOUT DASHBOARD */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
    .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }

    /* THỐNG KÊ SỐ */
    .stat-number { font-size: 48px; font-weight: bold; color: var(--danger); margin: 10px 0; }
    
    /* MODAL LOGOUT */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
    .modal-box { background: white; padding: 30px; border-radius: 10px; text-align: center; width: 300px; animation: popIn 0.3s ease; }
    @keyframes popIn { from {transform: scale(0.8); opacity: 0;} to {transform: scale(1); opacity: 1;} }
    .modal-actions { margin-top: 20px; display: flex; gap: 10px; justify-content: center; }
    .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
    .btn-cancel { background: #eee; } .btn-confirm { background: var(--danger); color: white; }

    /* TABLE STYLE */
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background-color: #f8f9fa; color: #333; }
    tr:hover { background-color: #f1f1f1; }
    .tag { padding: 5px 10px; border-radius: 15px; font-size: 12px; font-weight: bold; color: white; }
    .bg-red { background: #e74c3c; } .bg-yellow { background: #f1c40f; color: #333; } .bg-blue { background: #3498db; }
  </style>
</head>
<body>

  <div id="logoutModal" class="modal-overlay">
    <div class="modal-box">
      <h2 style="color: var(--danger); margin:0 0 10px;">Đăng xuất?</h2>
      <p>Bạn muốn thoát khỏi hệ thống?</p>
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeLogout()">Không</button>
        <button class="btn btn-confirm" onclick="confirmLogout()">Có</button>
      </div>
    </div>
  </div>

  <nav id="sidebar" class="sidebar">
    <h3 style="text-align:center; color:#fff; border-bottom:1px solid #444; padding-bottom:15px;">SMART TRAFFIC</h3>
    <a href="dashboard.html">📊 Dashboard</a>
    <a href="control.html">🚦 Traffic Lights</a>
    <a href="violation.html" class="active">🚨 Violations</a>
    <a href="#" onclick="showLogout()">🚪 Logout</a>
  </nav>

  <main id="main" class="content">
    <div class="top-bar">
      <button class="menu-btn" onclick="toggleMenu()">☰</button>
      <h2>Giám sát Vi phạm</h2>
    </div>

    <div class="grid">
      <div class="card" style="text-align:center">
        <h3>Tổng số Vi phạm (Hôm nay)</h3>
        <div class="stat-number"></div>
        <p style="color:#777">Phương tiện đã ghi nhận</p>
      </div>

      <div class="card">
        <h3 style="margin-bottom:20px">Phân loại lỗi vi phạm</h3>
        <div style="height: 250px;">
          <canvas id="violationChart"></canvas>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top: 20px;">
      <h3>Nhật ký vi phạm gần nhất</h3>
      <table>
        <thead>
          <tr>
            <th>Thời gian</th>
            <th>Biển số</th>
            <th>Loại lỗi</th>
            <th>Trạng thái</th>
          </tr>
        </thead>
        <tbody>
          <!-- <tr>
            <td>10:15:23</td>
            <td>29A-123.45</td>
            <td><span class="tag bg-red">Vượt đèn đỏ</span></td>
            <td>Chưa xử lý</td>
          </tr>
          <tr>
            <td>10:12:05</td>
            <td>30H-999.99</td>
            <td><span class="tag bg-yellow">Lấn làn</span></td>
            <td>Đã gửi phạt</td>
          </tr>
          <tr>
            <td>09:45:10</td>
            <td>59B-567.89</td>
            <td><span class="tag bg-blue">Quá tốc độ</span></td>
            <td>Chưa xử lý</td>
          </tr> -->
        </tbody>
      </table>
    </div>

  </main>

  <script>
    // 1. MENU & LOGOUT
    function toggleMenu() { document.getElementById('sidebar').classList.toggle('collapsed'); document.getElementById('main').classList.toggle('expanded'); }
    function showLogout() { document.getElementById('logoutModal').style.display = 'flex'; }
    function closeLogout() { document.getElementById('logoutModal').style.display = 'none'; }
    function confirmLogout() { localStorage.removeItem("loggedIn"); window.location.href = "login.html"; }

    // 2. VẼ BIỂU ĐỒ CHART.JS
    const ctx = document.getElementById('violationChart').getContext('2d');
    const myChart = new Chart(ctx, {
        type: 'doughnut', // Biểu đồ tròn
        data: {
            labels: ['Vượt đèn đỏ', 'Lấn làn', 'Quá tốc độ'],
            datasets: [{
                data: [12, 5, 6], 
                backgroundColor: ['#e74c3c', '#f1c40f', '#3498db'],
                borderWidth: 0,
                hoverOffset: 10
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { position: 'right' }
            },
            cutout: '65%' // Làm rỗng giữa
        }
    });
  </script>
</body>
</html>
