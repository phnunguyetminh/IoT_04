<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control | Smart Traffic</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root { --primary: #1976d2; --dark: #2c3e50; --light: #f4f6f8; --danger: #e74c3c; }
    body { margin: 0; font-family: 'Roboto', sans-serif; background: var(--light); overflow-x: hidden; }

    /* MENU & SIDEBAR */
    .sidebar { height: 100vh; width: 250px; position: fixed; top: 0; left: 0; background: var(--dark); color: white; transition: 0.3s; z-index: 100; padding-top: 60px; }
    .sidebar.collapsed { left: -250px; }
    .sidebar a { display: block; padding: 15px 25px; color: #ecf0f1; text-decoration: none; transition: 0.2s; }
    .sidebar a:hover, .sidebar a.active { background: #34495e; border-left: 4px solid var(--primary); }
    
    .content { margin-left: 250px; padding: 20px; transition: 0.3s; }
    .content.expanded { margin-left: 0; }
    .menu-btn { font-size: 24px; cursor: pointer; border: none; background: none; }
    .top-bar { display: flex; align-items: center; margin-bottom: 20px; }

    /* CONTROL GRID */
    .control-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
    @media (max-width: 768px) { .control-grid { grid-template-columns: 1fr; } }

    .card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
    
    /* INPUT STYLES */
    label { font-weight: bold; display: block; margin-top: 15px; color: #555; }
    input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
    .btn-apply { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; margin-top: 20px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.2s;}
    .btn-apply:hover { background: #1565c0; transform: translateY(-2px); }

    /* MODE BUTTONS */
    .mode-btn { flex: 1; padding: 10px; border: none; border-radius: 5px; cursor: pointer; opacity: 0.5; transition: 0.3s; font-weight: bold;}
    .mode-btn.active { opacity: 1; transform: scale(1.05); box-shadow: 0 2px 5px rgba(0,0,0,0.2); }

    /* VISUAL TRAFFIC LIGHT */
    .visual-box { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
    .pole { background: #222; width: 80px; padding: 20px; border-radius: 20px; display: flex; flex-direction: column; gap: 20px; align-items: center; box-shadow: 10px 10px 30px rgba(0,0,0,0.3); border: 3px solid #444; }
    .light { width: 60px; height: 60px; border-radius: 50%; background: #333; opacity: 0.2; transition: 0.3s; border: 2px solid #000; }
    
    /* GLOW EFFECTS */
    .red.active { background: #ff3b30; opacity: 1; box-shadow: 0 0 40px #ff3b30; }
    .yellow.active { background: #ffcc00; opacity: 1; box-shadow: 0 0 40px #ffcc00; }
    .green.active { background: #4cd964; opacity: 1; box-shadow: 0 0 40px #4cd964; }

    .timer { font-size: 80px; font-weight: bold; margin-top: 30px; font-family: monospace; color: #333; }

    /* MODAL */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
    .modal-box { background: white; padding: 30px; border-radius: 10px; text-align: center; width: 300px; animation: popIn 0.3s ease; }
    .modal-actions { margin-top: 20px; display: flex; gap: 10px; justify-content: center; }
    .btn { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
    .btn-cancel { background: #eee; } .btn-confirm { background: var(--danger); color: white; }
  </style>
</head>
<body>

  <div id="logoutModal" class="modal-overlay">
    <div class="modal-box">
      <h2 style="color: var(--danger); margin:0 0 10px;">Đăng xuất?</h2>
      <p>Bạn muốn thoát khỏi hệ thống?</p>
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeLogout()">Không</button>
        <button class="btn btn-confirm" onclick="confirmLogout()">Có</button>
      </div>
    </div>
  </div>

  <nav id="sidebar" class="sidebar">
    <h3 style="text-align:center; color:#fff; border-bottom:1px solid #444; padding-bottom:15px;">SMART TRAFFIC</h3>
    <a href="dashboard.html">📊 Dashboard</a>
    <a href="control.html" class="active">🚦 Traffic Lights</a>
    <a href="violation.html">🚨 Violations</a>
    <a href="#" onclick="showLogout()">🚪 Logout</a>
  </nav>

  <main id="main" class="content">
    <div class="top-bar">
      <button class="menu-btn" onclick="toggleMenu()">☰</button>
      <h2>Điều khiển đèn giao thông</h2>
    </div>

    <div class="control-grid">
      
      <div class="card">
        <h3 style="margin-top:0; color:var(--primary)">⚙️ Cấu hình thời gian</h3>
        <label>Thời gian Đèn Đỏ (s)</label>
        <input type="number" id="redInput" placeholder="...">

        <label>Thời gian Đèn Vàng (s)</label>
        <input type="number" id="yellowInput" placeholder="...">

        <label>Thời gian Đèn Xanh (s)</label>
        <input type="number" id="greenInput" placeholder="...">

        <button class="btn-apply" id="btnSave">LƯU CÀI ĐẶT LÊN SERVER</button>
        
        <hr style="margin: 30px 0; border: 0; border-top: 1px solid #eee;">
        
        <h3 style="margin-top:0; color:#555">Chế độ vận hành</h3>
        <div style="display:flex; gap:10px;">
          <button id="btnAuto" class="mode-btn" style="background:#2ecc71; color:white;">Tự động</button>
          <button id="btnManual" class="mode-btn" style="background:#95a5a6; color:white;">Thủ công</button>
        </div>
        <p style="font-size: 12px; color: #888; font-style: italic; margin-top: 10px;">*Chế độ thủ công sẽ dừng đếm ngược.</p>
      </div>

      <div class="card visual-box" style="background: #eef2f5;">
        <h3 style="margin-bottom: 30px; color:#777">Trạng thái Thực tế</h3>
        
        <div class="pole">
          <div id="red" class="light red"></div>
          <div id="yellow" class="light yellow"></div>
          <div id="green" class="light green"></div>
        </div>

        <div class="timer" id="timeDisplay">--</div>
        <p>Giây còn lại</p>
      </div>

    </div>
  </main>

  <script type="module">
    // 1. IMPORT FIREBASE (Dùng ../js/config.js để lùi ra thư mục cha)
    import { db } from '../js/config.js'; 
    import { ref, onValue, set, update } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

    // --- A. GIÁM SÁT ĐÈN (REAL-TIME) ---
    // Nghe dữ liệu từ nhánh 'traffic' để hiển thị đèn và số giây
    onValue(ref(db, 'traffic'), (snapshot) => {
        const data = snapshot.val();
        if(!data) return;

        // 1. Hiển thị số giây
        document.getElementById("timeDisplay").innerText = data.timer;

        // 2. Hiển thị đèn (0: Xanh, 1: Vàng, 2: Đỏ)
        document.querySelectorAll('.light').forEach(l => l.classList.remove('active'));
        
        if (data.current_light == 0) document.getElementById("green").classList.add("active");
        else if (data.current_light == 1) document.getElementById("yellow").classList.add("active");
        else if (data.current_light == 2) document.getElementById("red").classList.add("active");

        // 3. Hiển thị trạng thái chế độ (Auto/Manual)
        // Giả sử: is_active = true là Auto, false là Manual
        if (data.is_active) {
            document.getElementById("btnAuto").classList.add("active");
            document.getElementById("btnManual").classList.remove("active");
        } else {
            document.getElementById("btnAuto").classList.remove("active");
            document.getElementById("btnManual").classList.add("active");
        }
    });

    // --- B. QUẢN LÝ CÀI ĐẶT (SETTINGS) ---
    // Nghe dữ liệu từ nhánh 'traffic/settings' để điền vào ô input
    onValue(ref(db, 'traffic/settings'), (snapshot) => {
        const settings = snapshot.val();
        if(settings) {
            document.getElementById("redInput").value = settings.red_time || 0;
            document.getElementById("yellowInput").value = settings.yellow_time || 0;
            document.getElementById("greenInput").value = settings.green_time || 0;
        }
    });

    // --- C. CHỨC NĂNG ĐIỀU KHIỂN (GỬI LÊN FIREBASE) ---
    
    // 1. Lưu thời gian
    document.getElementById("btnSave").addEventListener("click", () => {
        const red = parseInt(document.getElementById("redInput").value);
        const yellow = parseInt(document.getElementById("yellowInput").value);
        const green = parseInt(document.getElementById("greenInput").value);

        // Gửi lên nhánh 'traffic/settings'
        update(ref(db, 'traffic/settings'), {
            red_time: red,
            yellow_time: yellow,
            green_time: green
        })
        .then(() => { alert("✅ Đã gửi cài đặt mới lên hệ thống!"); })
        .catch((error) => { alert("❌ Lỗi: " + error); });
    });

    // 2. Chuyển chế độ Auto
    document.getElementById("btnAuto").addEventListener("click", () => {
        update(ref(db, 'traffic'), { is_active: true });
    });

    // 3. Chuyển chế độ Manual
    document.getElementById("btnManual").addEventListener("click", () => {
        update(ref(db, 'traffic'), { is_active: false });
    });


    // --- D. MENU & LOGOUT (Giữ nguyên logic cũ) ---
    window.toggleMenu = function() { 
        document.getElementById('sidebar').classList.toggle('collapsed'); 
        document.getElementById('main').classList.toggle('expanded'); 
    }
    window.showLogout = function() { document.getElementById('logoutModal').style.display = 'flex'; }
    window.closeLogout = function() { document.getElementById('logoutModal').style.display = 'none'; }
    window.confirmLogout = function() { window.location.href = "login.html"; }
  </script>
</body>
</html>
